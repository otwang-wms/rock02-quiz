<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>岩石礦物分類大挑戰！</title>
    <style>
        * { box-sizing: border-box; font-family: '微軟正黑體', sans-serif; }
        body { margin: 0; padding: 0; background: #f4f6f9; min-height: 100vh; display: flex; justify-content: center; align-items: center; }
        
        .screen { display: none; width: 100%; max-width: 800px; background: white; padding: 30px; border-radius: 15px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); }
        .active-screen { display: block; }
        
        h1, h2, h3 { text-align: center; color: #333; }
        .instructions { background: #e9ecef; padding: 15px; border-radius: 8px; margin-bottom: 20px; line-height: 1.6; }
        
        input[type="text"], input[type="number"], input[type="password"] {
            width: 100%; padding: 12px; margin: 10px 0; border: 2px solid #ddd; border-radius: 8px; font-size: 18px; text-align: center;
        }
        
        .btn { 
            display: block; width: 100%; padding: 15px; background: #4CAF50; color: white; border: none; 
            border-radius: 8px; font-size: 20px; cursor: pointer; transition: 0.2s; font-weight: bold;
        }
        .btn:hover { background: #45a049; }
        .btn:disabled { background: #ccc; cursor: not-allowed; }
        
        /* 遊戲介面上方資訊 */
        .game-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 20px; font-size: 24px; font-weight: bold; }
        .timer-box { color: #d32f2f; width: 120px;}
        .hearts-box { color: #e91e63; text-align: right; width: 120px; }
        
        /* 分數與時間條 */
        .score-container { text-align: center; flex-grow: 1; }
        .score-text { font-size: 32px; color: #2196F3; }
        .time-bar-wrapper { margin: 30px auto 0 auto; width: 80%; height: 10px; background: #e0e0e0; border-radius: 5px; overflow: hidden; position: relative;}
        .time-bar { 
            height: 100%; width: 100%; float: right;
            background: linear-gradient(to right, red, orange, yellow, green, blue, purple); 
        }

        /* 遊戲按鈕區塊 */
        .board-container { width: 100%; height: 400px; background: #fafafa; border: 2px dashed #ccc; border-radius: 10px; padding: 20px; display: flex; flex-direction: column; justify-content: space-between; margin-bottom: 20px; }
        .board { display: grid; grid-template-columns: repeat(3, 1fr); grid-template-rows: repeat(2, 1fr); gap: 15px; flex-grow: 1; margin-bottom: 20px; }
        
        .option-btn {
            background: #fff; border: 3px solid #ddd; border-radius: 10px; font-size: 22px; font-weight: bold; cursor: pointer; position: relative; transition: transform 0.1s, box-shadow 0.2s; user-select: none; color: #333;
        }
        .option-btn:active { transform: scale(0.95); }
        .option-btn.selected { border-color: #FF9800; background: #FFF3E0; box-shadow: 0 0 15px rgba(255, 152, 0, 0.4); }
        
        .mark { position: absolute; font-size: 40px; z-index: 10; top: 50%; left: 50%; transform: translate(-50%, -50%); pointer-events: none; animation: popIn 0.3s ease-out; }
        @keyframes popIn { 0% { transform: translate(-50%, -50%) scale(0); opacity: 0; } 100% { transform: translate(-50%, -50%) scale(1); opacity: 1; } }

        /* 證書與榮譽榜 */
        .certificate { border: 8px solid #FFD700; padding: 30px; border-radius: 15px; background: #fffde7; text-align: center; margin-bottom: 30px; }
        .cert-title { font-size: 36px; color: #f57f17; margin: 0 0 20px 0; }
        .cert-name { font-size: 28px; font-weight: bold; color: #333; }
        .cert-score { font-size: 48px; color: #d32f2f; margin: 10px 0; }
        .cert-msg { font-size: 24px; color: #2e7d32; font-weight: bold; }
        
        .leaderboard-list { list-style: none; padding: 0; font-size: 20px; }
        .leaderboard-list li { display: flex; justify-content: space-between; padding: 10px; border-bottom: 1px solid #eee; }
        .leaderboard-list li:nth-child(1) { font-weight: bold; color: #d4af37; font-size: 24px;}
        .leaderboard-list li:nth-child(2) { font-weight: bold; color: #c0c0c0; }
        .leaderboard-list li:nth-child(3) { font-weight: bold; color: #cd7f32; }

        /* 管理員隱藏按鈕與彈跳視窗 */
        #admin-trigger { position: absolute; top: 0; left: 0; width: 40px; height: 40px; opacity: 0; cursor: pointer; z-index: 100; }
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); justify-content: center; align-items: center; z-index: 200; }
        .modal-content { background: white; padding: 30px; border-radius: 10px; text-align: center; width: 300px; }
    </style>
</head>
<body>

    <!-- 隱藏的管理員進入按鈕 -->
    <div id="admin-trigger"></div>

    <!-- 管理員密碼輸入框 -->
    <div class="modal" id="admin-modal">
        <div class="modal-content">
            <h3>管理員登入</h3>
            <input type="password" id="admin-pwd" placeholder="輸入密碼">
            <button class="btn" id="btn-login" style="background:#2196F3; margin-bottom:10px;">登入</button>
            <button class="btn" id="btn-cancel" style="background:#9e9e9e;">取消</button>
        </div>
    </div>

    <!-- 初始畫面 -->
    <div id="start-screen" class="screen active-screen">
        <h1>💎 岩石礦物分類大挑戰！ 💎</h1>
        <div class="instructions">
            <strong>【遊戲操作解說】</strong><br>
            1. 每次出題將顯示多個選項。<br>
            2. 請選出是屬於 <strong>[ 礦物 ]</strong> 的名稱。<br>
            3. <strong>全部選完才按”送出答案！”</strong><br>
            4. 答錯會扣愛心，時間歸零或愛心扣完遊戲即結束。<br>
            5. 每題有5秒作答時間，越快作答分數越高喔！
        </div>
        <input type="text" id="player-name" placeholder="請輸入您的名稱或暱稱 (必填)">
        <button class="btn" id="btn-start">開始挑戰！</button>
    </div>

    <!-- 管理介面 -->
    <div id="admin-screen" class="screen">
        <h2>⚙️ 管理員介面</h2>
        <div style="font-size: 20px; margin-bottom: 20px;">
            <label>倒數計時秒數 (預設60):</label><br>
            <input type="number" id="admin-time" value="60">
            <br><br>
            <label>是否清空線上紀錄:</label>
            <input type="checkbox" id="admin-clear" style="transform: scale(1.5); margin-left: 10px;"> 是
        </div>
        <button class="btn" id="btn-admin-confirm" style="background:#FF9800;">確定修改</button>
    </div>

    <!-- 遊戲畫面 -->
    <div id="game-screen" class="screen">
        <div class="game-header">
            <div class="timer-box">⏳ <span id="global-timer">60</span>s</div>
            <div class="score-container">
                <div class="score-text">分數: <span id="score-display">0</span></div>
                <div class="time-bar-wrapper">
                    <div id="time-bar" class="time-bar"></div>
                </div>
            </div>
            <div class="hearts-box" id="hearts-display">❤️❤️❤️</div>
        </div>
        
        <div class="board-container">
            <div class="board" id="board">
                <!-- 按鈕動態產生於此 -->
            </div>
            <button class="btn" id="btn-submit">送出答案！</button>
        </div>
    </div>

    <!-- 結束畫面 -->
    <div id="end-screen" class="screen">
        <div class="certificate">
            <div class="cert-title">🎖️ 挑戰完成證照 🎖️</div>
            <div class="cert-name" id="cert-name">玩家名稱</div>
            <div style="font-size: 20px; margin-top:10px;">最終得分</div>
            <div class="cert-score" id="cert-score">0</div>
            <div class="cert-msg" id="cert-msg">稱讚語句</div>
        </div>
        
        <h3 style="color:#d32f2f;">🏆 線上榮譽榜 (前10名) 🏆</h3>
        <ul class="leaderboard-list" id="leaderboard">
            <!-- 榜單動態產生於此 -->
        </ul>
        <button class="btn" id="btn-restart" style="margin-top:20px;">再次挑戰！</button>
    </div>

    <!-- Firebase 模組化 SDK (可選) -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, collection, addDoc, getDocs, query, orderBy, limit, deleteDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        /* 
           如果您想啟用真實線上資料庫，請將以下設定替換為您的 Firebase 專案設定。
           若維持原狀不修改，系統會自動使用瀏覽器的 LocalStorage 讓遊戲照常完美運行！
        */
        const firebaseConfig = {
            apiKey: "YOUR_API_KEY",
            authDomain: "YOUR_PROJECT_ID.firebaseapp.com",
            projectId: "YOUR_PROJECT_ID"
        };

        let db = null;
        if (firebaseConfig.apiKey !== "YOUR_API_KEY") {
            try {
                const app = initializeApp(firebaseConfig);
                db = getFirestore(app);
            } catch (e) { console.warn("Firebase 初始化失敗，切換為本地儲存。"); }
        }

        // ================= 遊戲資料 =================
        const rocksData = [
            {id:1, name:'安山岩'}, {id:2, name:'花崗岩'}, {id:3, name:'玄武岩'},
            {id:4, name:'石灰岩'}, {id:5, name:'頁岩'}, {id:6, name:'砂岩'},
            {id:7, name:'大理岩'}, {id:8, name:'板岩'}, {id:9, name:'片麻岩'}
        ];
        const mineralsData = [
            {id:10, name:'黑雲母'}, {id:11, name:'白雲母'}, {id:12, name:'石墨'},
            {id:13, name:'方解石'}, {id:14, name:'石英'}, {id:15, name:'硫磺'},
            {id:16, name:'滑石'}, {id:17, name:'長石'}, {id:18, name:'石膏'},
            {id:19, name:'金剛石'}
        ];

        // ================= 全域變數 =================
        let defaultTime = 60;
        let globalTimeLeft = 60;
        let lives = 3;
        let score = 0;
        let playerName = "";
        
        let globalInterval = null;
        let qReqId = null;
        let nextQTimeout = null;
        
        let isPlaying = false;
        let isQuestionActive = false;
        let qStartTimeMs = 0;
        let currentQuestionScore = 100;
        
        // 音效系統
        let audioCtx = null;
        function initAudio() {
            if (!audioCtx) { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); }
            if (audioCtx.state === 'suspended') { audioCtx.resume(); }
        }
        function playSound(type) {
            if (!audioCtx) return;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain); gain.connect(audioCtx.destination);
            if (type === 'correct') {
                osc.type = 'sine';
                osc.frequency.setValueAtTime(880, audioCtx.currentTime);
                osc.frequency.setValueAtTime(1100, audioCtx.currentTime + 0.1);
                gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
                osc.start(audioCtx.currentTime); osc.stop(audioCtx.currentTime + 0.3);
            } else {
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(250, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(100, audioCtx.currentTime + 0.3);
                gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
                osc.start(audioCtx.currentTime); osc.stop(audioCtx.currentTime + 0.3);
            }
        }

        // ================= 頁面切換 =================
        function showScreen(id) {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active-screen'));
            document.getElementById(id).classList.add('active-screen');
        }

        // ================= 工具函數 =================
        function shuffle(arr) {
            return arr.sort(() => Math.random() - 0.5);
        }

        function updateUI() {
            document.getElementById('global-timer').innerText = globalTimeLeft;
            document.getElementById('score-display').innerText = score;
            document.getElementById('hearts-display').innerText = '❤️'.repeat(lives);
        }

        // ================= 核心邏輯 =================
        document.getElementById('btn-start').addEventListener('click', () => {
            playerName = document.getElementById('player-name').value.trim();
            if (!playerName) { alert('請輸入您的名稱或暱稱！'); return; }
            initAudio();
            startGame();
        });

        function startGame() {
            globalTimeLeft = defaultTime;
            lives = 3;
            score = 0;
            isPlaying = true;
            updateUI();
            showScreen('game-screen');
            
            clearInterval(globalInterval);
            globalInterval = setInterval(() => {
                globalTimeLeft--;
                updateUI();
                if (globalTimeLeft <= 0) {
                    globalTimeLeft = 0;
                    endGame();
                }
            }, 1000);
            
            generateQuestion();
        }

        function generateQuestion() {
            if (!isPlaying) return;
            isQuestionActive = true;
            document.getElementById('btn-submit').disabled = false;
            document.getElementById('time-bar').style.width = '100%';
            
            let numRocks = Math.floor(Math.random() * 3) + 1; // 1~3
            let numMinerals = Math.floor(Math.random() * 3) + 1; // 1~3
            
            let selectedRocks = shuffle([...rocksData]).slice(0, numRocks).map(x => ({...x, type:'岩石'}));
            let selectedMinerals = shuffle([...mineralsData]).slice(0, numMinerals).map(x => ({...x, type:'礦物'}));
            let options = shuffle([...selectedRocks, ...selectedMinerals]);
            
            const board = document.getElementById('board');
            board.innerHTML = '';
            options.forEach(opt => {
                let btn = document.createElement('button');
                btn.className = 'option-btn';
                btn.innerText = opt.name;
                btn.dataset.type = opt.type;
                btn.addEventListener('click', function() {
                    if(isQuestionActive) this.classList.toggle('selected');
                });
                board.appendChild(btn);
            });
            
            qStartTimeMs = Date.now();
            cancelAnimationFrame(qReqId);
            animateTimeBar();
        }

        function animateTimeBar() {
            if (!isPlaying || !isQuestionActive) return;
            let elapsed = Date.now() - qStartTimeMs;
            let widthPercent = 100;

            // 0~1.5秒快，1.5~3秒中，3~5秒慢
            if (elapsed < 1500) {
                widthPercent = 100 - (elapsed / 1500) * 50;
            } else if (elapsed < 3000) {
                widthPercent = 50 - ((elapsed - 1500) / 1500) * 30;
            } else if (elapsed < 5000) {
                widthPercent = 20 - ((elapsed - 3000) / 2000) * 20;
            } else {
                widthPercent = 0;
            }

            widthPercent = Math.max(0, widthPercent);
            document.getElementById('time-bar').style.width = widthPercent + '%';
            currentQuestionScore = Math.floor(widthPercent);

            if (elapsed >= 5000) {
                evaluateAnswer(); // 時間到自動送出
            } else {
                qReqId = requestAnimationFrame(animateTimeBar);
            }
        }

        document.getElementById('btn-submit').addEventListener('click', evaluateAnswer);

        function evaluateAnswer() {
            if (!isQuestionActive) return;
            isQuestionActive = false;
            cancelAnimationFrame(qReqId);
            document.getElementById('btn-submit').disabled = true;

            let btns = document.querySelectorAll('.option-btn');
            let isCorrect = true;
            let mineralCount = 0, selectedMineralCount = 0, selectedRockCount = 0;

            btns.forEach(btn => {
                let isMineral = btn.dataset.type === '礦物';
                let isSelected = btn.classList.contains('selected');
                if (isMineral) mineralCount++;
                if (isMineral && isSelected) selectedMineralCount++;
                if (!isMineral && isSelected) selectedRockCount++;
            });

            // 必須選中所有礦物，且不能選到岩石
            if (selectedMineralCount === mineralCount && selectedRockCount === 0) {
                // 答對
                playSound('correct');
                score += currentQuestionScore;
                updateUI();
                generateQuestion(); // 立即下一題
            } else {
                // 答錯
                playSound('wrong');
                lives--;
                updateUI();
                
                // 顯示特效：錯誤的選擇打❌，真正的正確答案打⭕
                btns.forEach(btn => {
                    let isMineral = btn.dataset.type === '礦物';
                    let isSelected = btn.classList.contains('selected');
                    if ((!isMineral && isSelected) || (isMineral && !isSelected)) {
                        btn.innerHTML += `<div class="mark" style="color:red;">❌</div>`;
                    }
                    if (isMineral) {
                        btn.innerHTML += `<div class="mark" style="color:green;">⭕</div>`;
                    }
                });

                if (lives > 0 && globalTimeLeft > 0) {
                    nextQTimeout = setTimeout(generateQuestion, 1000);
                } else {
                    nextQTimeout = setTimeout(endGame, 1000);
                }
            }
        }

        async function endGame() {
            isPlaying = false;
            clearInterval(globalInterval);
            cancelAnimationFrame(qReqId);
            clearTimeout(nextQTimeout);

            document.getElementById('cert-name').innerText = playerName;
            document.getElementById('cert-score').innerText = score;
            
            let msgObj = document.getElementById('cert-msg');
            if (score >= 2000) msgObj.innerText = "你是地質學大師！太神啦！";
            else if (score >= 1000) msgObj.innerText = "表現得非常出色，繼續保持！";
            else if (score >= 500) msgObj.innerText = "做的不錯，再接再厲喔！";
            else msgObj.innerText = "繼續努力，下次一定會更好！";

            showScreen('end-screen');
            await saveScore(playerName, score);
            await loadLeaderboard();
        }

        // ================= 資料庫與榮譽榜邏輯 =================
        async function saveScore(name, scr) {
            if (db) {
                try { await addDoc(collection(db, "rock_leaderboard"), { name, score: scr, time: Date.now() }); } catch(e){}
            } else {
                let data = JSON.parse(localStorage.getItem('rock_leaderboard') || '[]');
                data.push({ name, score: scr, time: Date.now() });
                localStorage.setItem('rock_leaderboard', JSON.stringify(data));
            }
        }

        async function loadLeaderboard() {
            let list = document.getElementById('leaderboard');
            list.innerHTML = '讀取中...';
            let results = [];
            
            if (db) {
                try {
                    const qry = query(collection(db, "rock_leaderboard"), orderBy("score", "desc"), limit(10));
                    const snap = await getDocs(qry);
                    snap.forEach(doc => results.push(doc.data()));
                } catch(e){}
            } else {
                results = JSON.parse(localStorage.getItem('rock_leaderboard') || '[]');
                results.sort((a, b) => b.score - a.score);
                results = results.slice(0, 10);
            }
            
            list.innerHTML = '';
            if (results.length === 0) {
                list.innerHTML = '<li>目前還沒有紀錄喔！</li>';
            } else {
                results.forEach((item, index) => {
                    list.innerHTML += `<li><span>#${index+1} ${item.name}</span> <span>${item.score} 分</span></li>`;
                });
            }
        }

        document.getElementById('btn-restart').addEventListener('click', () => {
            document.getElementById('player-name').value = '';
            showScreen('start-screen');
        });

        // ================= 管理員後台系統 =================
        document.getElementById('admin-trigger').addEventListener('click', () => {
            document.getElementById('admin-modal').style.display = 'flex';
        });
        document.getElementById('btn-cancel').addEventListener('click', () => {
            document.getElementById('admin-modal').style.display = 'none';
            document.getElementById('admin-pwd').value = '';
        });
        document.getElementById('btn-login').addEventListener('click', () => {
            if (document.getElementById('admin-pwd').value === 'otwang2026') {
                document.getElementById('admin-modal').style.display = 'none';
                document.getElementById('admin-pwd').value = '';
                showScreen('admin-screen');
            } else {
                alert('密碼錯誤！');
            }
        });

        document.getElementById('btn-admin-confirm').addEventListener('click', async () => {
            defaultTime = parseInt(document.getElementById('admin-time').value) || 60;
            
            if (document.getElementById('admin-clear').checked) {
                if (db) {
                    const snap = await getDocs(collection(db, "rock_leaderboard"));
                    snap.forEach(async (d) => await deleteDoc(d.ref));
                } else {
                    localStorage.removeItem('rock_leaderboard');
                }
                alert('線上紀錄已清空並重新紀錄！');
                document.getElementById('admin-clear').checked = false;
            }
            showScreen('start-screen');
        });

    </script>
</body>
</html>
